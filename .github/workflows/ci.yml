name: CI

on:
  push:
    branches: [ main, v1-polish ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run unit tests with core dependencies
        run: |
          python -m unittest discover -s tests

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spider-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: spider-ui
        run: npm ci

      - name: Typecheck UI
        working-directory: spider-ui
        run: npm run typecheck

      - name: Test UI
        working-directory: spider-ui
        run: npm test

      - name: Build UI for serve and check artifact consistency
        working-directory: spider-ui
        run: |
          npm run build:serve
          git diff --exit-code ../spider/static_ui

